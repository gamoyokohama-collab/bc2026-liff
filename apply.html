<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="UTF-8" />
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root { --line-green: #06C755; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    background: #ffffff;
    color: #262626;
  }
  .header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 16px;
    border-bottom: 1px solid #f0f0f0;
  }
  .header .title { font-size: 17px; font-weight: 600; }
  .container { padding: 20px; }
  .event-name { font-size: 14px; color: #9a9a9a; margin-bottom: 6px; }
  .event-date { font-size: 19px; font-weight: 700; margin-bottom: 28px; line-height: 1.4; }
  .field { margin-bottom: 20px; }
  .field label { font-size: 14px; font-weight: 500; color: #7a7a7a; letter-spacing: 0.02em; display: block; }
  .field label .required { color: var(--line-green); }
  .field .sub { color: #b0b0b0; font-weight: 400; }
  .name-display {
    margin-top: 6px;
    border-radius: 8px;
    background: #fafafa;
    border: 1px solid #e5e5e5;
    padding: 12px 14px;
    font-size: 16px;
    color: #7a7a7a;
  }
  input[type="text"] {
    margin-top: 6px;
    width: 100%;
    border-radius: 8px;
    border: 1px solid #d4d4d4;
    padding: 12px 14px;
    font-size: 16px;
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--line-green); box-shadow: 0 0 0 1px var(--line-green); }
  .count-grid { margin-top: 8px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .count-btn {
    padding: 12px 0;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    border: 1px solid #d4d4d4;
    background: #fff;
    color: #7a7a7a;
  }
  .count-btn.active { background: var(--line-green); border-color: var(--line-green); color: #fff; }
  .submit-btn {
    width: 100%;
    padding: 14px 0;
    border-radius: 12px;
    border: none;
    color: #fff;
    font-size: 17px;
    font-weight: 600;
    background: var(--line-green);
  }
  .submit-btn:disabled { opacity: 0.3; }
  .status {
    text-align: center;
    padding: 60px 20px;
    font-size: 15px;
    color: #9a9a9a;
  }
  .status.error { color: #d9534f; }
  .ticket { text-align: center; padding: 40px 20px; }
  .ticket img { width: 200px; height: 200px; margin-bottom: 16px; }
  .ticket .salon { font-size: 19px; font-weight: 700; }
  .ticket .count { font-size: 15px; color: #7a7a7a; margin-top: 6px; }
  .ticket .id { font-size: 13px; color: #c0c0c0; margin-top: 10px; letter-spacing: 0.05em; }
</style>
</head>
<body>

<div id="app">
  <div class="status" id="loading">読み込んでいます…</div>
</div>

<script>
// GAS側のdoGetが埋め込む値(コード編集不要):
// スクリプトプロパティ「LIFF_ID_APPLY」の値と、このApps ScriptのデプロイURL
const LIFF_ID = "2010919674-9rgJz2oE";
const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwwMJgIRQA-3dK7XImX3JiPbiGcv44hZTH1C0dhR1qfxXdHrFCM8zyLMXbOMMxT9UAlIA/exec";
const EVENT_NAME = "神奈川ビューティコレクション2026";
const EVENT_DATE = "10月6日(火) 横浜産貿ホール マリネリア";

let profile = null;
let selectedCount = null;

async function init() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }
    profile = await liff.getProfile();
    renderForm();
  } catch (err) {
    renderError("読み込みに失敗しました。時間をおいて再度お試しください。");
    console.error(err);
  }
}

function renderForm() {
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="header">
      <div class="title">来場お申し込み</div>
    </div>
    <div class="container">
      <div class="event-name">${EVENT_NAME}</div>
      <div class="event-date">${EVENT_DATE}</div>

      <div class="field">
        <label>お名前(LINEより取得)</label>
        <div class="name-display">${escapeHtml(profile.displayName)}</div>
      </div>

      <div class="field">
        <label>サロン名 <span class="required">*</span></label>
        <input type="text" id="salonName" placeholder="例)ヘアサロン ガモウ 横浜店" />
      </div>

      <div class="field">
        <label>
          来場予定人数 <span class="required">*</span><br />
          <span class="sub">(5名以上でお越しの場合は5＋を選択してください)</span>
        </label>
        <div class="count-grid" id="countGrid">
          ${[1, 2, 3, 4, "5+"].map(n => `<button type="button" class="count-btn" data-count="${n}">${n}名</button>`).join("")}
        </div>
      </div>
    </div>
    <div class="container" style="padding-top:0;">
      <button class="submit-btn" id="submitBtn" disabled>この内容で申し込む</button>
    </div>
  `;

  document.querySelectorAll(".count-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      selectedCount = btn.dataset.count;
      document.querySelectorAll(".count-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      updateSubmitState();
    });
  });

  document.getElementById("salonName").addEventListener("input", updateSubmitState);
  document.getElementById("submitBtn").addEventListener("click", submitApply);
}

function updateSubmitState() {
  const salonName = document.getElementById("salonName").value.trim();
  document.getElementById("submitBtn").disabled = !(salonName && selectedCount);
}

async function submitApply() {
  const salonName = document.getElementById("salonName").value.trim();
  const submitBtn = document.getElementById("submitBtn");
  submitBtn.disabled = true;
  submitBtn.textContent = "送信中…";

  try {
    const res = await fetch(GAS_WEBAPP_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain" }, // GAS Web AppのCORS制約回避のためtext/plainで送る
      body: JSON.stringify({
        type: "apply",
        userId: profile.userId,
        displayName: profile.displayName,
        salonName: salonName,
        count: selectedCount
      })
    });
    const data = await res.json();

    if (data.status === "ok") {
      renderTicket(salonName, selectedCount, data.ticketId);
    } else if (data.status === "duplicate") {
      renderError("すでにお申し込みいただいています。");
    } else if (data.status === "full") {
      renderError("大変申し訳ございません。定員に達しました。");
    } else {
      renderError("送信に失敗しました。時間をおいて再度お試しください。");
    }
  } catch (err) {
    renderError("通信エラーが発生しました。時間をおいて再度お試しください。");
    console.error(err);
  }
}

function renderTicket(salonName, count, ticketId) {
  const qrUrl = "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=" + encodeURIComponent(ticketId);
  document.getElementById("app").innerHTML = `
    <div class="header"><div class="title">申し込み完了</div></div>
    <div class="ticket">
      <img src="${qrUrl}" alt="QRチケット" />
      <div class="salon">${escapeHtml(salonName)} 様</div>
      <div class="count">来場予定 ${count}名</div>
      <div class="id">ID: ${ticketId}</div>
    </div>
    <div class="container" style="text-align:center; color:#9a9a9a; font-size:14px;">
      当日はこちらのQRコードを受付でご提示ください。<br />
      このQRコードはLINEのトーク画面にも送信されています。
    </div>
  `;
}

function renderError(message) {
  document.getElementById("app").innerHTML = `<div class="status error">${escapeHtml(message)}</div>`;
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

init();
</script>
</body>
</html>
