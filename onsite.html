<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>神奈川ビューティコレクション2026 当日受付</title>

<link rel="preconnect" href="https://static.line-scdn.net">
<link rel="preconnect" href="https://access.line.me">
<link rel="preconnect" href="https://api.line.me">
<script defer charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
  :root { --line-green: #06C755; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
    background: #ffffff;
    color: #262626;
  }
  .header { padding: 20px; border-bottom: 1px solid #f0f0f0; }
  .header .event { font-size: 12px; color: #999; margin-bottom: 4px; }
  .header .venue { font-size: 16px; font-weight: 700; line-height: 1.4; }
  .header .badge {
    display: inline-block; margin-top: 8px; padding: 3px 10px; border-radius: 999px;
    background: #e8f8ef; color: var(--line-green); font-size: 11px; font-weight: 700;
  }
  .content { padding: 20px; padding-bottom: 100px; }
  .field { margin-bottom: 20px; }
  .field label {
    display: block; font-size: 11px; font-weight: 600; color: #767676;
    letter-spacing: 0.02em; margin-bottom: 6px;
  }
  .field .readonly {
    border-radius: 8px; background: #fafafa; border: 1px solid #e5e5e5;
    padding: 10px 12px; font-size: 13px; color: #767676;
  }
  .field input[type="text"], .field select {
    width: 100%; border-radius: 8px; border: 1px solid #d4d4d4; padding: 10px 12px;
    font-size: 13px; font-family: inherit; outline: none; background: #fff;
  }
  .field input[type="text"]:focus, .field select:focus {
    border-color: var(--line-green); box-shadow: 0 0 0 1px var(--line-green);
  }
  .field select:disabled { color: #b0b0b0; background: #fafafa; }
  .count-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 6px; }
  .count-btn {
    padding: 10px 0; border-radius: 8px; border: 1px solid #d4d4d4; background: #fff;
    font-size: 13px; font-weight: 600; color: #767676; cursor: pointer;
  }
  .count-btn.active { background: var(--line-green); border-color: var(--line-green); color: #fff; }
  .footer {
    position: fixed; bottom: 0; left: 0; right: 0; padding: 14px 20px 20px;
    background: #fff; border-top: 1px solid #f0f0f0;
  }
  .submit-btn {
    width: 100%; padding: 14px 0; border-radius: 12px; border: none;
    background: var(--line-green); color: #fff; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .submit-btn:disabled { opacity: 0.3; cursor: default; }

  .loading-screen { padding: 80px 24px; text-align: center; }
  .spinner {
    width: 32px; height: 32px; border-radius: 50%; border: 3px solid #eee;
    border-top-color: var(--line-green); margin: 0 auto 16px; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 13px; color: #767676; }

  .status-screen { display: none; padding: 60px 24px; text-align: center; }
  .status-screen.show { display: block; }
  .status-icon {
    width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; margin: 0 auto 20px; font-size: 28px; color: #fff;
  }
  .status-icon.error { background: #e0505a; }
  .status-icon.warn { background: #e0a326; }
  .status-title { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
  .status-message { font-size: 13px; color: #767676; line-height: 1.6; }

  /* ===== チェックイン完了画面(受付スタッフが一目で判別できるよう全面緑) ===== */
  .done-screen {
    display: none; position: fixed; inset: 0; background: var(--line-green); color: #fff;
    flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; text-align: center;
  }
  .done-screen.show { display: flex; }
  .done-check {
    width: 96px; height: 96px; border-radius: 50%; background: #fff; color: var(--line-green);
    font-size: 56px; font-weight: 700; display: flex; align-items: center; justify-content: center;
    margin-bottom: 20px;
  }
  .done-title { font-size: 28px; font-weight: 800; letter-spacing: 0.05em; margin-bottom: 20px; }
  .done-salon { font-size: 20px; font-weight: 700; margin-bottom: 6px; word-break: break-all; }
  .done-count { font-size: 15px; opacity: 0.9; margin-bottom: 4px; }
  .done-sub { font-size: 13px; opacity: 0.9; margin-bottom: 24px; }
  .done-clock {
    font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums;
    background: rgba(0,0,0,0.12); border-radius: 12px; padding: 6px 20px; margin-bottom: 20px;
  }
  .done-note { font-size: 14px; font-weight: 700; }
  .done-extra { font-size: 11px; opacity: 0.85; margin-top: 10px; line-height: 1.6; }

  #formScreen { display: none; }
</style>
</head>
<body>

<div id="loadingScreen" class="loading-screen">
  <div class="spinner"></div>
  <div class="loading-text" id="loadingText">受付情報を確認しています…</div>
</div>

<div id="formScreen">
  <div class="header">
    <div class="event">神奈川ビューティコレクション2026</div>
    <div class="venue">10月6日(火) 横浜産貿ホール マリネリア</div>
    <div class="badge">当日受付</div>
  </div>

  <div class="content">
    <div class="field">
      <label>お名前(LINEより取得)</label>
      <div class="readonly" id="displayNameBox">取得中…</div>
    </div>

    <div class="field">
      <label>サロン名 *</label>
      <input type="text" id="salonName" placeholder="例)ヘアサロン ガモウ 横浜店">
    </div>

    <div class="field">
      <label>担当営業</label>
      <select id="salesRep" disabled>
        <option value="">読み込み中…</option>
      </select>
    </div>

    <div class="field">
      <label>来場人数 *</label>
      <div class="count-grid" id="countGrid">
        <button type="button" class="count-btn" data-count="1">1名</button>
        <button type="button" class="count-btn" data-count="2">2名</button>
        <button type="button" class="count-btn" data-count="3">3名</button>
        <button type="button" class="count-btn" data-count="4+">4+名</button>
      </div>
    </div>
  </div>

  <div class="footer">
    <button type="button" class="submit-btn" id="submitBtn" disabled>受付する</button>
  </div>
</div>

<div id="statusScreen" class="status-screen"></div>

<div id="doneScreen" class="done-screen">
  <div class="done-check">✓</div>
  <div class="done-title">チェックイン完了</div>
  <div class="done-salon" id="doneSalon"></div>
  <div class="done-count" id="doneCount"></div>
  <div class="done-sub" id="doneSub"></div>
  <div class="done-clock" id="doneClock">--:--:--</div>
  <div class="done-note">この画面を受付スタッフにお見せください</div>
  <div class="done-extra" id="doneExtra"></div>
</div>

<script>
  // ===== 設定 =====
  const LIFF_ID = "2010919674-rN8ZeisM"; // 神奈川BC2026当日受付
  const GAS_URL = "https://script.google.com/macros/s/AKfycbwwMJgIRQA-3dK7XImX3JiPbiGcv44hZTH1C0dhR1qfxXdHrFCM8zyLMXbOMMxT9UAlIA/exec";

  let profile = null;
  let salesReps = [];
  let salesRepsLoaded = false;
  let selectedCount = null;
  let selectedRepIndex = "";
  let isSubmitting = false;

  const loadingScreen = document.getElementById("loadingScreen");
  const loadingText = document.getElementById("loadingText");
  const formScreen = document.getElementById("formScreen");
  const statusScreen = document.getElementById("statusScreen");
  const doneScreen = document.getElementById("doneScreen");
  const displayNameBox = document.getElementById("displayNameBox");
  const salonNameInput = document.getElementById("salonName");
  const salesRepSelect = document.getElementById("salesRep");
  const countGrid = document.getElementById("countGrid");
  const submitBtn = document.getElementById("submitBtn");

  // ----- 画面切り替え -----
  function hideAll() {
    loadingScreen.style.display = "none";
    formScreen.style.display = "none";
    statusScreen.className = "status-screen";
    doneScreen.className = "done-screen";
  }

  function showStatus(type, title, message) {
    hideAll();
    statusScreen.className = "status-screen show";
    statusScreen.innerHTML = `
      <div class="status-icon ${type}">!</div>
      <div class="status-title">${title}</div>
      <div class="status-message">${message}</div>
    `;
  }

  function showForm() {
    hideAll();
    formScreen.style.display = "block";
    loadSalesReps();
  }

  // 時計は1秒ごとに動かす。スクリーンショットの使い回しを見分けるため。
  let clockTimer = null;
  function startClock() {
    const clock = document.getElementById("doneClock");
    const tick = () => {
      clock.textContent = new Date().toLocaleTimeString("ja-JP", { hour12: false });
    };
    tick();
    if (!clockTimer) clockTimer = setInterval(tick, 1000);
  }

  function showDone(data) {
    hideAll();
    document.getElementById("doneSalon").textContent = (data.salonName || "") + " 様";
    document.getElementById("doneCount").textContent = data.count ? `${data.count}名` : "";
    document.getElementById("doneSub").textContent =
      data.status === "already"
        ? `${data.checkedAt} にチェックイン済みです`
        : `${data.checkedAt} 受付`;
    document.getElementById("doneExtra").textContent =
      data.isNew ? "LINEのトーク画面にQRチケットもお送りしました。" : "";
    doneScreen.className = "done-screen show";
    startClock();
  }

  // ----- GAS呼び出し(GET) -----
  async function callGas(params) {
    const res = await fetch(`${GAS_URL}?${new URLSearchParams(params).toString()}`);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    // 混雑でロックが取れなかった場合は、通信失敗と同じくリトライの対象にする
    if (data.status === "busy") throw new Error("busy");
    return data;
  }

  // GASの結果に応じて画面を出し分ける
  function handleResult(data) {
    switch (data.status) {
      case "checked_in":
      case "already":
        showDone(data);
        break;
      case "not_registered":
        showForm();
        break;
      case "closed":
        showStatus("warn", "当日受付の時間外です",
          "当日受付は10月6日の開催時間中のみご利用いただけます。");
        break;
      default:
        showStatus("error", "受付できませんでした",
          (data.message || "") + "<br>お手数ですが、受付スタッフにお声がけください。");
    }
  }

  // ① QRを読んだ直後:申込済みかどうかを確認(申込済みならGAS側で即チェックイン)
  async function checkRegistration(isRetry) {
    try {
      const data = await callGas({ action: "onsite_checkin", userId: profile.userId });
      handleResult(data);
    } catch (err) {
      console.error("checkRegistration error:", err, "isRetry:", isRetry);
      if (!isRetry) {
        loadingText.textContent = "混み合っています。もう一度確認しています…";
        setTimeout(() => checkRegistration(true), 1500);
      } else {
        showStatus("error", "通信できませんでした",
          "電波の良い場所で、もう一度QRコードを読み取ってください。<br>" +
          "解決しない場合は受付スタッフにお声がけください。");
      }
    }
  }

  // ② 未申込の方:フォーム送信で申込+チェックイン
  function updateSubmitState() {
    submitBtn.disabled = !(salonNameInput.value.trim() && selectedCount);
  }

  countGrid.addEventListener("click", (e) => {
    const btn = e.target.closest(".count-btn");
    if (!btn) return;
    [...countGrid.children].forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
    selectedCount = btn.dataset.count;
    updateSubmitState();
  });
  salonNameInput.addEventListener("input", updateSubmitState);
  salesRepSelect.addEventListener("change", (e) => { selectedRepIndex = e.target.value; });

  async function loadSalesReps() {
    if (salesRepsLoaded) return;
    try {
      const res = await fetch(`${GAS_URL}?action=getSalesReps`);
      const data = await res.json();
      if (data.status === "ok" && Array.isArray(data.reps)) salesReps = data.reps;
    } catch (err) {
      console.error("loadSalesReps error:", err);
    }
    salesRepSelect.innerHTML = "";
    const placeholder = document.createElement("option");
    placeholder.value = "";
    placeholder.textContent = "選択してください";
    salesRepSelect.appendChild(placeholder);
    salesReps.forEach((rep, i) => {
      const opt = document.createElement("option");
      opt.value = i;
      opt.textContent = rep.name;
      salesRepSelect.appendChild(opt);
    });
    salesRepsLoaded = true;
    salesRepSelect.disabled = false;
  }

  // GAS側は同じuserIdの行があれば「チェックイン済み」を返すだけなので、
  // リトライで二重に届いても行は増えない。
  async function submitOnsite(isRetry) {
    if (!isRetry) {
      if (isSubmitting) return;
      isSubmitting = true;
    }
    submitBtn.disabled = true;
    submitBtn.textContent = isRetry ? "再送信中…" : "受付中…";

    const rep = (salesRepsLoaded ? salesReps[selectedRepIndex] : null) || { code: "", name: "" };
    try {
      const data = await callGas({
        action: "onsite_apply",
        userId: profile.userId,
        displayName: profile.displayName,
        salonName: salonNameInput.value.trim(),
        count: selectedCount,
        repCode: rep.code || "",
        repName: rep.name || ""
      });
      handleResult(data);
    } catch (err) {
      console.error("submitOnsite error:", err, "isRetry:", isRetry);
      if (!isRetry) {
        setTimeout(() => submitOnsite(true), 1500);
      } else {
        showStatus("warn", "受付結果を確認できませんでした",
          "もう一度QRコードを読み取ってください。受付が済んでいれば、そのまま完了画面が表示されます。<br>" +
          "解決しない場合は受付スタッフにお声がけください。");
      }
    }
  }
  submitBtn.addEventListener("click", () => submitOnsite(false));

  // ----- 起動 -----
  // 申込済みかどうかの判定にuserIdが必要なため、ここではプロフィール取得を待つ。
  async function init() {
    try {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }
      profile = await liff.getProfile();
      displayNameBox.textContent = profile.displayName;
      checkRegistration(false);
    } catch (err) {
      console.error("init error:", err);
      showStatus("error", "画面を開けませんでした", "LINEアプリでQRコードを読み取ってください。");
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
</script>

</body>
</html>
